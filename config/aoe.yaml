# AOE runtime configuration. ${VAR} references are expanded from the environment.
database_url: ${AOE_DATABASE_URL}
blob_dir: data/blobs

claude:
  binary: claude
  workdir: data/claude-workdir   # empty and dedicated: no repo hooks, CLAUDE.md or .mcp.json leak in
  version_pin: "2.1.306"         # upgrade deliberately, then re-run the eval suite
  grace: 15s                     # SIGINT → SIGKILL on timeout
  mcp_binary: aoe-mcp            # research tools server; the worker writes the MCP config for it

worker:
  concurrency: 4
  lease: 10m
  poll_interval: 5s

scheduler:
  tick: 1m

limits:
  max_agent_turns_per_day: 2000  # Claude runs on the Enterprise subscription: caps are turns, not dollars

models:                          # Claude Code --model aliases per tier
  fast: haiku
  mid: sonnet
  top: opus

http:
  user_agent: "aoe-research/0.1 (personal market research)"
  timeout: 60s

extraction:
  max_queued_tasks: 8           # backpressure on the daily turn budget
  max_docs_per_batch: 20
  max_bytes_per_batch: 60000

# Problems (docs/02 §6). Similarity is cosine for vectors (when embeddings
# are configured) or pg_trgm text similarity otherwise. Between the two
# thresholds the model adjudicates. Calibrate on labelled pairs.
clustering:
  vector_high: 0.92
  vector_low: 0.75
  trigram_high: 0.85
  trigram_low: 0.25
  candidates: 5
  max_per_run: 200
  adjudicate_batch: 15

# Triage turns problems into opportunities. A problem needs this many
# independent origins (different buyers, reviewers or sites) first.
triage:
  min_independent_origins: 2
  max_per_day: 40

# Research agents answer opportunities' open questions, kill questions
# first, within each opportunity's earned budget (SCH-3).
research:
  max_per_day: 30
  max_concurrent: 3
  max_turns: 30

founder_profile: config/founder.yaml

# The weekly cycle (docs/08). B0, the one-shot baseline, runs early in the
# week; the digest is built when due and waits up to baseline_wait for B0
# so its blind pairs have cards. Limits are the founder's attention budget.
digest:
  weekday: monday
  hour: 7                       # UTC
  cards: 3
  approvals: 5
  pairs: 2
  spot_checks: 3
  changes: 5
  baseline_wait: 6h
  min_p_ge_500: 0.2             # card bar: P(MRR >= $500 at 12 months); 0 shows every assessed opportunity
  out_dir: data/digests         # a markdown copy of each digest
baseline:
  enabled: true
  cards: 3
  max_turns: 40

# Local open-source embedding model (docs/04 §7). Empty provider disables
# embeddings; docker-compose sets these for its bundled Ollama service.
embeddings:
  provider: ${AOE_EMBED_PROVIDER}   # ollama | tei
  url: ${AOE_EMBED_URL}             # e.g. http://ollama:11434
  model: nomic-embed-text
  dimensions: 768
  batch_size: 64

# ToS register (SRC-2). A source can't be enabled without an entry for its type.
tos:
  - source_type: usaspending_awards
    access_method: official_api
    terms_url: https://api.usaspending.gov/
    reviewed_at: "2026-10-21"
    allowed_use: >-
      Public US federal spending data published by the Treasury; the API needs no key.
      Used to find recurring, budgeted service work and its buyers.
    rate_limit_per_min: 60
    notes: >-
      Entry drafted from general knowledge, not a line-by-line terms review; confirm
      before relying on it. No published rate limit found, so 60/min is a conservative default.

  - source_type: app_marketplace
    access_method: official_api
    terms_url: https://developer.atlassian.com/platform/marketplace/rest/v2/
    reviewed_at: "2026-10-21"
    allowed_use: >-
      Public marketplace listings, pricing and reviews (Atlassian Marketplace REST API v2;
      WordPress.org plugin API and public review feeds). Reviewer names are stored only as hashes.
    rate_limit_per_min: 60
    notes: >-
      One entry covers every app_marketplace instance; add a separate entry type if a
      platform's terms differ. Drafted from general knowledge; confirm before relying on it.
  - source_type: web_fetch
    access_method: public_web
    terms_url: https://www.rfc-editor.org/rfc/rfc9309
    reviewed_at: "2026-10-21"
    allowed_use: >-
      Agent-requested fetches of public pages for research. robots.txt is honoured,
      one request per host every 2 seconds, no logins, paywalls or anti-bot bypassing.
    rate_limit_per_min: 30
  - source_type: hn_search
    access_method: official_api
    terms_url: https://hn.algolia.com/api
    reviewed_at: "2026-10-22"
    allowed_use: Searching public Hacker News stories and comments, on a schedule and on demand, to discover and corroborate problems. Author handles are stored only as hashes.
    rate_limit_per_min: 60
  - source_type: github_search
    access_method: official_api
    terms_url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
    reviewed_at: "2026-10-22"
    allowed_use: Searching public issues through the REST API, weekly and on demand, to discover and corroborate problems; no scraping of github.com pages. Author logins are stored only as hashes. Set GITHUB_TOKEN for higher limits.
    rate_limit_per_min: 9   # unauthenticated search allows 10/min

sources:
  - name: federal-service-contracts
    type: usaspending_awards
    enabled: true
    cadence: 24h
    config:
      min_amount: 5000          # small recurring service contracts
      max_amount: 250000
      lookback_days: 30         # first run starts 30 days back
      window_days: 1
      max_windows_per_run: 14
      # filters are passed verbatim to the API's "filters" object, e.g.
      # filters: {naics_codes: ["5614"]}

  # App marketplaces: one connector type, one entry per marketplace slice.
  # Evidence of paid demand, not a limit on what AOE recommends building.
  - name: atlassian-jira-paid
    type: app_marketplace
    enabled: true
    cadence: 24h
    config: {platform: atlassian, application: jira, hosting: cloud, cost: paid,
             max_apps_per_run: 150, reviews_per_app: 50, max_review_stars: 3, include_pricing: true}
  - name: atlassian-confluence-paid
    type: app_marketplace
    enabled: true
    cadence: 24h
    config: {platform: atlassian, application: confluence, hosting: cloud, cost: paid,
             max_apps_per_run: 150, reviews_per_app: 50, max_review_stars: 3, include_pricing: true}
  - name: wordpress-popular
    type: app_marketplace
    enabled: true
    cadence: 24h
    config: {platform: wordpress, browse: popular, min_installs: 10000,
             max_apps_per_run: 100, reviews_per_app: 30, max_review_stars: 3}

  # Practitioner discussion in the founder's domains (SRE and platform
  # engineering, LLM infrastructure, workflow orchestration; see
  # config/founder.yaml). Edit the queries as the focus changes. HN items are
  # fetched once each (a cursor per query); GitHub issues are re-read weekly
  # because their upvote counts change.
  - name: hn-infra
    type: hn_search
    enabled: true
    cadence: 24h
    config:
      hits_per_query: 500
      lookback_days: 90         # first run: a quarter of history, so problems can corroborate
      min_text_chars: 160
      # Matched exactly (no typo tolerance; multi-word queries as phrases).
      # Tool names find practitioners discussing their tools far more often
      # than descriptive phrases do. Ambiguous words ("temporal", "helm")
      # are avoided or qualified.
      queries:
        # SRE and platform engineering
        - kubernetes
        - terraform
        - prometheus
        - grafana
        - datadog
        - pagerduty
        - opentelemetry
        - argocd
        - helm chart
        - on-call
        - postmortem
        - runbook
        - cron job
        # LLM infrastructure
        - vllm
        - litellm
        - ollama
        - langfuse
        - evals
        - inference costs
        - LLM gateway
        # Workflow orchestration
        - airflow
        - dagster
        - prefect
  - name: github-infra
    type: github_search
    enabled: true
    cadence: 168h
    config:
      per_query: 30
      sort: reactions-+1
      min_body_chars: 200
      queries:
        - is:issue is:open label:enhancement reactions:>25 kubernetes
        - is:issue is:open label:enhancement reactions:>25 helm
        - is:issue is:open label:enhancement reactions:>25 terraform
        - is:issue is:open reactions:>25 "feature request" prometheus
        - is:issue is:open reactions:>25 "feature request" grafana
        - is:issue is:open reactions:>25 "feature request" opentelemetry
        - is:issue is:open reactions:>25 "feature request" argocd
        - is:issue is:open reactions:>15 "feature request" vllm
        - is:issue is:open reactions:>15 "feature request" litellm
        - is:issue is:open reactions:>15 "feature request" ollama
        - is:issue is:open reactions:>25 "feature request" airflow
        - is:issue is:open reactions:>15 "feature request" temporal

  # On-demand sources used by agent tools (never collected on a schedule).
  - {name: web, type: web_fetch, enabled: false}
  - {name: hn, type: hn_search, enabled: false}
  - {name: github, type: github_search, enabled: false}
